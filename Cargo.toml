[package]
name = "svdp"
version = "0.3.0"
edition = "2024"
description = "Admin tools for the St Vincent de Paul society at Nativity Catholic Church in Menlo Park, CA."

[dependencies]
anyhow = "1.0.101"
chrono = "0.4.43"
clap = { version = "4.5.57", features = ["derive"] }
csv = "1.4.0"
directories = "6.0.0"
dotenvy = "0.15.7"
form_urlencoded = "1.2.2"
reqwest = { version = "0.13.2", features = ["cookies", "form", "json"] }
rmcp = { version = "3.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.2"
scraper = "0.25.0"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.20"
tokio = { version = "1.49.0", features = ["full"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
